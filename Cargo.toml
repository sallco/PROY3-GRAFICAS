[package]
name = "nadir"
version = "0.1.0"
edition = "2024"
authors = ["sallco <dcalderon918@gmail.com>"]
description = "Observatorio de mundos imposibles con rasterización en CPU"

[dependencies]
raylib = "5.5.1"
noise = "0.9.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
opt-level = 2
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
